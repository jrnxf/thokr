name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  formula-changes:
    name: formula-changes
    runs-on: ubuntu-latest
    outputs:
      formula: ${{ steps.filter.outputs.formula }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            formula:
              - 'Formula/**'
              - '.github/workflows/build.yml'

  homebrew:
    name: homebrew
    needs: formula-changes
    if: needs.formula-changes.outputs.formula == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: tap this checkout
        run: brew tap jrnxf/thokr "$GITHUB_WORKSPACE"
      - name: install
        run: brew install --build-from-source jrnxf/thokr/thokr
      - name: test
        run: brew test jrnxf/thokr/thokr
      - name: audit
        # the lowercase description is the owner's choice, so skip only the FormulaAudit/Desc cop
        run: brew audit --strict --except-cops=FormulaAudit/Desc jrnxf/thokr/thokr
