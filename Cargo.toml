[package]
name = "thokr"
description = "sleek typing tui with visualized results and historical logging"
version = "0.6.0"
readme = "README.md"
repository = "https://github.com/jrnxf/thokr.git"
homepage = "https://github.com/jrnxf/thokr"
license = "MIT"
authors = ["Colby Thomas <colby@jrnxf.co>"]
edition = "2024"
rust-version = "1.88"
exclude = [".github", "*.log", "plans"]
keywords = ["tui", "terminal", "typing"]

[dependencies]
cgisf_lib = "0.1.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
rand = "0.8.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }

[dev-dependencies]
insta = "1.49"

[profile.release]
lto = true
codegen-units = 1
strip = true
